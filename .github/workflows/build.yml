# push / PR ごとに exe・zip・setup.exe をビルドして動作確認する。
# v* のタグを push すると、そのバージョンで GitHub Release を作って配布物を載せる。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEG_VERSION: "9.0.2"
  FFMPEG_SHA256: "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-essentials-${{ env.FFMPEG_SHA256 }}

      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          $ProgressPreference = "SilentlyContinue"  # 進捗表示があると Invoke-WebRequest がとても遅くなる
          $name = "ffmpeg-$env:FFMPEG_VERSION-essentials_build"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "ffmpeg のハッシュが一致しません: $hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          $src = "$env:RUNNER_TEMP\ffmpeg\$name"
          Copy-Item "$src\bin\ffmpeg.exe", "$src\bin\ffprobe.exe", "$src\LICENSE" vendor/ffmpeg/

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Decide version
        id: version
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $v = "0.0.0-dev." + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: python build.py --version "${{ steps.version.outputs.version }}"

      - name: Smoke test (install and convert)
        run: |
          $ffmpeg = "vendor/ffmpeg/ffmpeg.exe"
          $ffprobe = "vendor/ffmpeg/ffprobe.exe"
          $work = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory -Force $work | Out-Null
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=2560x1440:rate=144" `
            -f lavfi -i "sine=f=440" -t 3 -c:v libx264 -preset ultrafast -c:a aac "$work\in.mp4"

          $dir = "$work\app"
          $setup = "dist\X-video-converter-setup-${{ steps.version.outputs.version }}.exe"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", '/TASKS=""', "/DIR=`"$dir`"" -Wait
          & "$dir\X動画変換.exe" "$work\in.mp4" -o "$work\out" --no-wait
          if ($LASTEXITCODE -ne 0) { throw "変換に失敗しました" }

          $info = & $ffprobe -v error -select_streams v -show_entries stream=codec_name,profile,width,height,avg_frame_rate,pix_fmt `
            -of compact=p=0:nk=1 "$work\out\in_x.mp4"
          Write-Output $info
          if ($info -ne "h264|High|1920|1080|yuv420p|60/1") { throw "出力が想定と違います: $info" }

      - uses: actions/upload-artifact@v4
        with:
          name: X-video-converter-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -e "s/{{VERSION}}/${version}/g" -e "s/{{FFMPEG_VERSION}}/${FFMPEG_VERSION}/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/X-video-converter-setup-${version}.exe#X動画変換 インストーラー (おすすめ)" \
            "dist/X-video-converter-${version}-windows.zip#X動画変換 zip 版" \
            --title "X動画変換 v${version}" --notes-file notes.md
